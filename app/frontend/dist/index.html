<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DTE Chile</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="fondo" aria-hidden="true">
  <svg class="escena" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="g-cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--cielo-1)"/><stop offset="1" stop-color="var(--cielo-2)"/></linearGradient>
      <linearGradient id="g-mar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--mar-1)"/><stop offset="1" stop-color="var(--mar-2)"/></linearGradient>
      <linearGradient id="g-haz" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--haz)" stop-opacity=".85"/><stop offset="1" stop-color="var(--haz)" stop-opacity="0"/></linearGradient>
      <radialGradient id="g-luz"><stop offset="0" stop-color="var(--haz)" stop-opacity=".9"/><stop offset="1" stop-color="var(--haz)" stop-opacity="0"/></radialGradient>
      <radialGradient id="g-astro"><stop offset="0" stop-color="var(--astro)"/><stop offset=".6" stop-color="var(--astro)"/><stop offset="1" stop-color="var(--astro)" stop-opacity="0"/></radialGradient>
      <radialGradient id="g-halo"><stop offset="0" stop-color="var(--astro)" stop-opacity=".35"/><stop offset="1" stop-color="var(--astro)" stop-opacity="0"/></radialGradient>
      <mask id="m-luna"><circle cx="1240" cy="210" r="62" fill="#fff"/><circle cx="1270" cy="192" r="56" fill="#000"/></mask>
    </defs>
    <rect width="1600" height="900" fill="url(#g-cielo)"/>
    <g class="estrellas" fill="var(--estrella)">
      <circle cx="140" cy="120" r="2"/><circle cx="380" cy="70" r="1.5"/><circle cx="520" cy="190" r="1.2"/><circle cx="760" cy="90" r="2"/><circle cx="930" cy="160" r="1.4"/>
      <circle cx="1120" cy="60" r="1.8"/><circle cx="1290" cy="140" r="1.3"/><circle cx="1450" cy="90" r="2"/><circle cx="1530" cy="230" r="1.2"/><circle cx="240" cy="260" r="1.3"/>
      <circle cx="640" cy="300" r="1.1"/><circle cx="1010" cy="280" r="1.6"/><circle cx="1380" cy="320" r="1.2"/><circle cx="60" cy="330" r="1.5"/><circle cx="860" cy="230" r="1"/>
    </g>
    <circle class="sol" cx="1240" cy="210" r="70" fill="url(#g-astro)"/>
    <g class="luna"><circle cx="1240" cy="210" r="120" fill="url(#g-halo)"/><circle cx="1240" cy="210" r="62" fill="var(--astro)" mask="url(#m-luna)"/></g>
    <path class="cerros" d="M0 560 Q160 470 330 520 T700 500 T1060 540 T1600 480 V900 H0Z" fill="var(--cerro)"/>
    <g class="olas-lejos"><path d="M-1600 600 Q-1500 585 -1400 600 T-1200 600 T-1000 600 T-800 600 T-600 600 T-400 600 T-200 600 T0 600 T200 600 T400 600 T600 600 T800 600 T1000 600 T1200 600 T1400 600 T1600 600 V900 H-1600Z" fill="url(#g-mar)"/></g>
    <g class="haz"><polygon points="0,-20 1500,-230 1500,230 0,20" fill="url(#g-haz)"/></g>
    <circle class="luz" cx="430" cy="330" r="38" fill="url(#g-luz)"/>
    <g class="roca"><path d="M300 700 Q360 640 430 650 T560 700 L600 760 H270Z" fill="var(--roca)"/></g>
    <g class="faro">
      <path d="M400 650 L412 400 H448 L460 650Z" fill="var(--faro)"/>
      <path d="M406 530 L454 530 L456 560 L404 560Z" fill="var(--faro-franja)"/><path d="M403 600 L457 600 L459 630 L401 630Z" fill="var(--faro-franja)"/>
      <rect x="404" y="392" width="52" height="10" rx="3" fill="var(--faro-oscuro)"/>
      <rect x="412" y="352" width="36" height="40" fill="var(--haz)" opacity=".95"/>
      <rect x="406" y="346" width="48" height="8" rx="3" fill="var(--faro-oscuro)"/>
      <path d="M414 346 Q430 318 446 346Z" fill="var(--faro-oscuro)"/>
      <rect x="424" y="460" width="12" height="18" rx="2" fill="var(--faro-oscuro)" opacity=".7"/>
    </g>
    <g class="olas-cerca"><path d="M-1600 690 Q-1520 668 -1440 690 T-1280 690 T-1120 690 T-960 690 T-800 690 T-640 690 T-480 690 T-320 690 T-160 690 T0 690 T160 690 T320 690 T480 690 T640 690 T800 690 T960 690 T1120 690 T1280 690 T1440 690 T1600 690 V900 H-1600Z" fill="var(--mar-2)" opacity=".85"/></g>
  </svg>
</div>
<div id="entrada" class="entrada">
  <div class="entrada-centro">
    <div class="entrada-logo"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M20 42l3-24h2l3 24z"/><path d="M18 18h12M17 14h14M20 14v4M28 14v4"/><path d="M24 7l-4 7h8z"/><path d="M31 10l12-5M31 14h13M31 18l12 5" opacity=".7"/></svg></div>
    <h1 class="marca-nombre">Faro</h1>
    <p>Cobra, emite y aprende con boletas y facturas. Nada sale de aquí sin que lo decidas.</p>
    <button id="entrar" disabled>Arrancando el motor…</button>
  </div>
</div>
<div class="shell">
  <header class="top">
    <div class="brand" onclick="ir('inicio')"><span class="logo"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M20 42l3-24h2l3 24z"/><path d="M18 18h12M17 14h14M20 14v4M28 14v4"/><path d="M24 7l-4 7h8z"/><path d="M31 10l12-5M31 14h13M31 18l12 5" opacity=".7"/></svg></span><span class="marca-nombre">Faro</span></div>
    <label class="sel-wrap" title="Empresa activa"><span>Empresa</span><select id="empresa" class="sel"></select></label>
    <div class="top-r">
      <div id="mundo" class="mundo m-cargando" title="En qué mundo estás">cargando…</div>
      <div class="camino" id="camino" title="Tu camino: cinco etapas, de cero a emitir"><div id="camino_lista"></div></div>
    </div>
  </header>
  <main id="vista" class="wrap"></main>
  <nav class="dock" aria-label="Navegación">
    <a href="#inicio" data-v="inicio"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg></i><span>Inicio</span></a>
    <a href="#cobrar" data-v="cobrar"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></i><span>Cobrar</span></a>
    <a href="#documentos" data-v="documentos"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></i><span>Documentos</span></a>
    <a href="#aprender" data-v="aprender"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5v4.5c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v5"/></svg></i><span>Aprender</span></a>
    <span class="sep"></span>
    <a href="#ajustes" data-v="ajustes" title="Ajustes: tu IA, valores del día, panel del motor"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/></svg></i><span>Ajustes</span></a>
  </nav>
</div>

<div id="aviso" class="aviso" style="display:none"></div>
<div id="tour" class="tour" style="display:none"></div>
<script src="tauri.js"></script>
<script src="puente.js"></script>
<script src="app.js"></script>
<script src="tour.js"></script>
</body>
</html>
