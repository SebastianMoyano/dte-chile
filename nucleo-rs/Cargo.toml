[package]
name = "dtechile"
version = "0.1.0"
edition = "2021"
description = "DTE Chile: el núcleo del motor de facturación electrónica para el SII, en Rust (fase 8 del port; bytes idénticos al corpus dorado)"
license = "MIT"
publish = false

[lib]
name = "dtechile"
path = "src/lib.rs"

[[bin]]
name = "nucleo-dorado"
path = "src/bin/nucleo-dorado.rs"

[[bin]]
name = "nucleo-pdf"
path = "src/bin/nucleo-pdf.rs"

[[bin]]
name = "nucleo-servidor"
path = "src/bin/nucleo-servidor.rs"

[[bin]]
name = "nucleo-mcp"
path = "src/bin/nucleo-mcp.rs"

[[bin]]
name = "nucleo-emitir"
path = "src/bin/nucleo-emitir.rs"

[[bin]]
name = "nucleo-cafs"
path = "src/bin/nucleo-cafs.rs"

[[bin]]
name = "nucleo-rvd"
path = "src/bin/nucleo-rvd.rs"

[[bin]]
name = "nucleo-valores"
path = "src/bin/nucleo-valores.rs"

[[bin]]
name = "nucleo-sii"
path = "src/bin/nucleo-sii.rs"

[[bin]]
name = "nucleo-portal"
path = "src/bin/nucleo-portal.rs"

[[bin]]
name = "nucleo-keystore"
path = "src/bin/nucleo-keystore.rs"

[[bin]]
name = "nucleo-certificacion"
path = "src/bin/nucleo-certificacion.rs"

[[bin]]
name = "nucleo-siiengine"
path = "src/bin/nucleo-siiengine.rs"

[dependencies]
rsa = { version = "0.9", features = ["sha1", "pem"] }
sha1 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x509-cert = { version = "0.2", features = ["pem"] }
p12-keystore = "0.4"
regex = "1"
flate2 = "1"
ureq = { version = "3", default-features = false, features = ["gzip", "rustls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
tiny_http = "0.12"
hmac = "0.12"
aes = "0.8"
rand = "0.8"
sha2 = { version = "0.10", features = ["oid"] }
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
argon2 = "0.6.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
